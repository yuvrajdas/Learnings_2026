            if(n == 0) return 0;
            if(n == 1) return 1;

        Array.prototype.myForEach = function(cb){
            if(typeof cb !== 'function'){
                throw new Error(cb, 'not a function')
                return;
            }

            for(let i = 0; i<this.length; i++){
                cb(this[i], i, this);
            }

        }

        Array.prototype.myMap = function(cb){
            if(typeof cb !== 'function'){
                throw new Error(cb, 'not a function')
                return;
            }

            let res = []
            
            for(let i = 0; i<this.length; i++){
                res.push(cb(this[i], i, this));
            }
            return res;
        }

        Array.prototype.myFilter = function(cb) {
            if(typeof cb !== 'function'){
                throw new Error(cb, 'not a function')
                return;
            }

            let res = []
            
            for(let i = 0; i<this.length; i++){

                if(cb(this[i], i, this)){
                    res.push(this[i], i, this);
                }
            }
            return res;
        }


        Array.prototype.myReduce = function(cb, initilaValue){
            if(typeof cb !== 'function'){
                throw new Error(cb, 'not a function')
                return;
            }

            let startIdx;
            let acc;

            if(initilaValue !== undefined){
                acc = initilaValue;
                startIdx = 0;
            } else{
                acc = this[0]
                startIdx = 1;
            }

            for(let i = startIdx; i<this.length; i++){
                acc = cb(acc, this[i], i, this)
            }

            return acc;
        }

        function throtterl(){

            if(!isAwait){

            }

        function searchData(e){
            console.log(e.target.value);
            
        }

        function debounce(cb, delay){
            let timer;

            return function(...args){
                clearInterval(timer);

                timer =   setTimeout(()=>{
                    cb.call(this, ...args);
                },delay)
            }
        }

        const betterFun = debounce(searchData, 2000)
