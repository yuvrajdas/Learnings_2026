<script>

    let arr = [1,2,3,4,5];

    Array.prototype.myReduce = function(cb, intialValue){
        if(typeof cb !== 'function'){
            throw new Error(cb, 'is not a function');
        }

        let acc;
        let startIdx;

        if(intialValue !== undefined){
            acc = intialValue;
            startIdx = 0;
        }else{
            acc = this[0];
            startIdx = 1;
        }

        for(let i=startIdx; i<this.length; i++){
            acc = cb(acc, this[i], i, this)
        }
        return acc;
    }
    
    let rr = arr.myReduce((acc, crr)=>{
        acc+=crr;
        return acc;
    }, 0)

    console.log(rr);
    

    Array.prototype.myFilter = function(cb){
        let res = []

        for(let i=0; i<this.length; i++){
            if(cb(this[i], i, this)){
                res.push(cb(this[i], i, this))
            }
        }
        return res;
    }

    Array.prototype.myMap = function(cb){
        if(typeof cb !== 'function'){
            throw new Error(cb , 'not a function')
        }

        let res = [];

        for(let i=0; i<this.length; i++){
            res.push(cb(this[i], i, this))
        }

        return res;
    }

    let res = arr.myMap((ele)=>{

    // ----------------- throuttle --------------------
    function executeFire(e){
        console.log(e);
    }
    let await = false;
    let bullet = 0
    
    function fire(){
        if(!await){
            await = true;
            bullet++
            executeFire.call(this, bullet)

            setTimeout(()=>{
                await = false;
            }, 2000)
        }
    }


    // ------------------ debounce --------------------
    function search(e){
        console.log(e.target.value);        
    }

    function debounce(cb, delay){

        let timer;

        return function(...args){
            clearInterval(timer);

            timer = setTimeout(()=>{
                cb.call(this, ...args);
            }, delay)
        }
    }

    const betterFun = debounce(search, 2000)
