 <div style="height: 430px; width: 800px; overflow-y: auto;" (scroll)="onScroll($event)">
   
        <table border="1px">
            <thead style="position: sticky; top:0px; background: white;">
                <tr>
                    <th >ID</th>
                    <th >Title</th>
                    <th >Body</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let user of usersData;">
                    <td>{{ user.id }}</td>
                    <td>{{ user.title }}</td>
                    <td>{{ user.body }}</td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="loading">Loading...</div>
    </div>
     {{usersData.length}}
